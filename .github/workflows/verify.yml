name: Verify demo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.28'
      - run: uv sync --frozen --extra dev
      - run: uv lock --check
      - run: uv run --no-sync python demo.py setup
      - run: uv run --no-sync cayu inspect --json
      - run: uv run --no-sync cayu check --fail-on warning --json
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync cayu eval run
      - run: uv run --no-sync python -m evals.run --output-dir "$RUNNER_TEMP/evals"
